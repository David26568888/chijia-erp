spring.application.name=chijia-erp

# 伺服器埠號設定
server.port=8080

# MySQL 連線設定
spring.datasource.url=jdbc:mysql://localhost:3306/chijia_erp?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# JPA / Hibernate 設定
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 核心設定：在開發階段，讓 JPA 自動根據我們的 Entity 在資料庫中 [自動建表/更新欄位]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 💡 允許單一檔案上傳的最大容量 (設定為 10MB)
spring.servlet.multipart.max-file-size=10MB

# 💡 允許單次 Request (包含其他 form-data) 的最大容量
spring.servlet.multipart.max-request-size=10MB