
spring.application.name=chijia-erp

#伺服器埠號設定
server.port= 8080

#MySQL 連線設定 
spring.datasource.url= jdbc:mysql://localhost:3306/chijia_erp?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

#JPA / Hibernate設定
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#核心設定:在開發階段，讓JPA 自動根據我的Entity在資料庫中[自動見表/更新欄位]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
